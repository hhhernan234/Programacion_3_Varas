<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitación - Sistema de Nómina</title>
</head>
<body>

    <main>
        <article>
            <header>
                <h1>Tutorial: Generación de Nómina Mensual</h1>
                <p>Guía completa dividida en dos módulos de capacitación.</p>
            </header>

            <section aria-label="Portada de capacitación">
                <img src="imagenes/dinero.jpg" 
                     alt="Banner explicativo del proceso de nómina 2026" 
                     width="800">
            </section>

            <section aria-label="Videos de tutorial">
                <h2>Módulos de Video</h2>
                
                <h3>Parte 1: Configuración Inicial</h3>
                <video controls width="800" preload="metadata">
                    <source src="videos/gestor_nomina.mp4" type="video/mp4">
                    Tu navegador no soporta el video.
                </video>

                <h3>Parte 2: Generación de Reportes</h3>
                <video controls width="800" preload="metadata">
                    <source src="videos/contador.mp4" type="video/mp4">
                    Tu navegador no soporta el video.
                </video>
            </section>

            <section>
                <h3>Puntos clave:</h3>
                <ul>
                    <li>Verificación de horas extras.</li>
                    <li>Cálculo de deducciones IESS.</li>
                    <li>Generación del reporte final.</li>
                </ul>
            </section>
        </article>
    </main>

</body>
</html>
