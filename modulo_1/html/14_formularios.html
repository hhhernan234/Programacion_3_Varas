<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <form action="/procesar" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre</label><br>
                    <input type="text" id="nombre" name="nombre">
                </td>
                <td>
                    <label for="email">Correo Electrónico</label>
                    <br>
                    <input type="email" id="email" name="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña</label><br>
                    <input type="password" id="password" name="password">
                </td>
                <td>
                    <label for="url">Sitio Web</label><br>
                    <input type="url" id="url" name="url">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="telefono">Telefono</label><br>
                    <input type="tel" id="telefono" name="telefono">
                </td>
                <td>
                    <label for="buscar">Buscar</label><br>
                    <input type="search" id="buscar" name="buscar">
                </td>
            </tr>

            <!--Tipos numericos-->
            <tr>
                <td>
                    <label for="edad">Edad</label><br>
                    <input type="number" id="edad" name="edad" min="0" max="120" step="1">
                </td>
                <td>
                    <label for="volumen">Volumen:<span id="volumen-value">50</span></label><br>
                    <input type="range" id="volumen" name="volumen" min="0" max="100" value="50" 
                    oninput="document.getElementById('volumen-value').textContent = this.value">
                </td>
            </tr>

            <!-- tipos de fecha  -->
            <tr>
                <td colspan="2">
                    <h3>Tipos de  fechas</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fecha">Fecha de nacimiento</label><br>
                    <input type="date" id="fecha" name="fecha">
                </td>
                <td>
                    <label for="hora">Hora de la cita</label><br>
                    <input type="time" id="hora" name="hora">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="evento">Inicio del evento</label><br>
                    <input type="datetime-local" id="evento" name="evento">
                </td>
                <td>
                    <label for="mes">Mes de inicio</label><br>
                    <input type="month" id="mes" name="mes">
                </td>
            </tr>


            <!-- Checkbox y Option-->
             <tr>
                <td colspan="2">
                    <h3>Checkbox y option</h3>
                </td>
             </tr>
            <tr>
                <td>
                    <input type="checkbox" id="acepto" name="acepto" value="si">
                    <label for="acepto">Acepto los terminos y condiciones</label><br>
                </td>
                <td>
                    <fieldset>
                        <legend>
                            Metodo de pago
                        </legend>
                        <input type="radio" id="tarjeta" name="pago" value="tarjeta">
                        <label for="tarjeta">Tarjeta de credito</label>
                        <input type="radio" id="paypal" name="pago" value="paypal">
                        <label for="for">Paypal</label>
                        <input type="radio" id="transferencia" name="pago" value="transferencia">
                        <label for="transferencia">Transferencia bancaria</label>
                    </fieldset>
                </td>
            </tr>

              <!-- Utiles-->
              <tr>
                <td colspan="2">
                    <h3>Útiles</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="color">Color</label><br>
                    <input type="color" id="color" name="color" value="#3b82f6">
        
                </td>
                <td>
                    <label for="color">Foto de perfil:</label><br>
                    <input type="file" id="foto" name="foto" value="image/">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="docs">Documentos</label><br>
                    <input type="file" id="docs" name="documentos" accept=".pdf,.doc,.docx">
        
                </td>
                <td>
    
                    <input type="hidden" id="token" name="token" value="abcd123xyz">
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <h3>Textarea y Select</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="mensaje">Mensaje</label><br>
                    <textarea id="mensaje" 
                        name="mensaje" 
                        rows="6" 
                        cols="50" placeholder="Escribe tu mensaje aquí"></textarea>
                </td>
                <td>
                    <!--Select basico-->
                    <label for="pais">Pais:</label><br>
                    <select id="pais" name="pais">
                        <option value="">--Selecione un pais--</option>
                        <option value="co">--Colombia--</option>
                        <option value="">--Ecuador--</option>
                        <option value="">--España--</option>
                        <option value="">--Venezuela--</option>
                    </select>
               
                </td>   
            </tr>
            <tr>
                <td>
                    <!--Seleccion con outgroup-->
                    <label for="ciudad">Ciudades:</label><br>
                    <select id="ciudad" name="ciudad">
                        <optgroup label="España">
                            <option value="mad">Madrid</option>
                            <option value="bcn">Barcelona</option>
                            <option value="sev">Sevilla</option>
                        </optgroup>
                        <optgroup label="Mexico">
                            <option value="mad">Ciudad de Mexico</option>
                            <option value="gdl">Guadalajara</option>
                        </optgroup>
                        <optgroup label="Venezuela">
                            <option value="cor">Coro</option>
                            <option value="mar">Maracaibo</option>
                        </optgroup>
                    </select>
                </td>
                <td>
                    <!--Seleccion multiple-->
                    <label for="skill">Habilidades:</label><br>
                    <select id="skill" name="habilidades[]" multiple size="4">
                        <option value="html5">HTML5</option>
                        <option value="css3">CSS3</option>
                        <option value="js">Javascript</option>
                        <option value="ts">Typescript</option>
                    </select>
                </td>
            </tr>

        </table>

        <button type="submit">Enviar</button> 
        <button type="reset">Limpiar</button> 
        <button type="button">Aceptar</button> 
    </form>
</body>
</html>
