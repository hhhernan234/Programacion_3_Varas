<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Nóminas</title>
    <script src="dom12-crud-productos_mp.js" defer></script>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    h2 {
        color: #333;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }
    th {
        background-color: #f2f2f2;
    }
    tr:nth-child(even) {
        background-color: #f9f9f9;
    }
    .formulario {
    background-color: aliceblue;
    border: 1px solid #d9f3f2;
    padding: 20px;
    margin-top: 20px;
    }

    .formulario input {
        padding: 8px;           /* Un padding moderado para que el texto respire */
        width: 180px;           /* Ancho fijo suficiente para el texto */
        margin-right: 10px;     /* Espacio a la derecha de cada input */
        box-sizing: border-box; /* Asegura que el padding no desborde el ancho */
    }

    .btn-agregar {
        padding: 8px 16px;      /* Tamaño adecuado para el botón */
        cursor: pointer;
    }

    .btn-agregar:hover {
        background-color: rgb(128, 221, 221);
        color: #f9f9f9;
    }
    .btn-cancelar:hover {
        background-color: bisque;
        color: #333;
    }

    .stat-card {
    display: inline-block;
    width: 200px;
    padding: 15px;
    margin: 10px;
    background-color: #80dcec;
    border: 1px solid #ea3a3a;
    border-radius: 5px;
    text-align: center;
    }

    .stats-card h3 {
        margin-bottom: 10px;
        color: #555;
    }
</style>
</head>
<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2>CRUD de Empleados</h2>
    <div id="stats">
        <div class="stat-card">
            <h3>Total Empleados</h3>
            <p id="totalProductos">0</p>
        </div>
        <div class="stat-card">
            <h3>Sueldo Promedio</h3>
            <p id="precioPromedio">0</p>
        </div>
        <div class="stat-card">
            <h3>Empleado Mejor Pagado</h3>
            <p id="productoMasCaro">N/A</p>
        </div>
        <div class="stat-card">
            <h3>Empleado Menor Pagado</h3>
            <p id="productoMasBarato">N/A</p>
        </div>
    </div>
    <div class="formulario">
        <h3>Agregar Nuevo Empleado</h3>
        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" placeholder="Nombre del empleado">
        <label for="descripcion">Cargo:</label>
        <input id="descripcion" type="text" placeholder="Cargo del empleado">
        <label for="precio">Sueldo:</label>
        <input id="precio" type="number" placeholder="Sueldo del empleado">
        <button id="btn_agregar" class="btn-agregar">Agregar</button>
        <button id="btn_cancelar" class="btn_cancelar">Cancelar</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cargo</th>
                <th>Sueldo</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>
</body>
</html>
